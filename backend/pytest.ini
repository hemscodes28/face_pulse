[pytest]
# Face Pulse backend test configuration

asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show detailed test output
addopts =
    -v
    --tb=short
    --strict-markers

markers =
    asyncio: mark test as asyncio (handled by pytest-asyncio)
