# alembic.ini — Face Pulse backend Alembic configuration
#
# Run from the backend/ directory:
#   alembic upgrade head
#   alembic downgrade base
#   alembic revision --autogenerate -m "describe change"

[alembic]
# Path to migration scripts (relative to this file = backend/)
script_location = migrations

# Template for new revision file names
file_template = %%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# Prepend sys.path with these paths on startup
prepend_sys_path = .

# SQLAlchemy URL — overridden by env.py which reads from pydantic-settings.
# Do NOT put real credentials here.
sqlalchemy.url = postgresql+psycopg2://placeholder:placeholder@localhost/face_pulse

[post_write_hooks]
# Uncomment to auto-format generated migrations with black:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
# WARNING: Do not set to DEBUG in production — it logs full SQL statements
# which may expose sensitive query data.
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
