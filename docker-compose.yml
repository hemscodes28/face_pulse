# ============================================================
# Face Pulse — Development PostgreSQL Container
# ============================================================
# Provides a local PostgreSQL 16 instance for development.
# No application containers are defined here yet.
#
# Usage:
#   docker compose up -d
#   docker compose down          # stop (data preserved)
#   docker compose down -v       # stop and delete volume (data lost)
#
# Requires: Docker Desktop (not installed on this machine — install
#           from https://docs.docker.com/get-docker/ to use this file)
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: face_pulse_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-face_pulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-face_pulse}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-face_pulse_user} -d ${POSTGRES_DB:-face_pulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
